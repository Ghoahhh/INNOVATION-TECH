<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../css/main.css">
    <link rel="stylesheet" href="../css/products.css">
    <title>Innovation Tech</title>
</head>
<body>
    <header>
        <nav class="container">
            <a href="../index.html">
                <img src="../img/logo-icon.png" alt="">
                <span>Innovation Tech</span>
            </a>
            <button id="menuButton" type="button" onclick="document.getElementById('menu').classList.toggle('show')" aria-label="Abrir menú">☰</button>
            <ul id="menu">
                <li><a class="active" href="index.html">Inicio</a></li>
                <li><a href="products.html">Productos</a></li>
            </ul>
            <div>
                <button id="cartButton" type="button" aria-label="Abrir Carrito">🛒<span id="cartNum">0</span></button>
                <details>
                    <summary id="accountBtn">Cuenta ▾</summary>
                    <div>
                        <strong id="accountName">Invitado</strong>
                        <section id="accountMenu">
                            <button id="openLogin">Iniciar sesión</button>
                            <button id="openRegister">Crear cuenta</button>
                        </section>
                        <section id="userMenu" hidden>
                            <a href="dashboard.html">Mi perfil</a>
                            <a href="dashboard.html#orders">Mis pedidos</a>
                            <a id="adminButton" href="admin.html#home" hidden>Panel Admin</a>
                            <button onclick="logout()">Cerrar sesión</button>
                        </section>
                    </div>
                </details>
            </div>
        </nav>
    </header>
    <main class="hero">
        <section class="hero">
            <article id="productDatails"></article>
        </section>
    </main>
        <dialog id="Login">
            <button class="close-button" type="button" onclick="Login.close()">×</button>
            <h2>Iniciar sesion</h2>
            <form class="login" onsubmit="login(this); return false;">
                <label>Tipo de documento<select name="type_document" required><option default>...</option><option value="cc">Cédula de Ciudadanía</option><option value="ce">Cédula de Extranjería</option><option value="nit">NIT</option><option value="passport">Passport</option><option value="ppt">PPT</option></select></label>
                <label>Documento<input name="document" type="text" placeholder="Ingresa el documento" required></label>
                <label>Contraseña<input name="password" type="password" placeholder="Ingresa la contraseña" required></label>
                <footer><button type="submit">Entrar</button></footer>
            </form>
            <footer>¿No tienes una cuenta? <a onclick="Login.close(); Register.showModal()">Crear cuenta</a></footer>
        </dialog>
        <dialog id="Register">
            <button class="close-button" type="button" onclick="Register.close()">×</button>
            <h2>Crear cuenta</h2>
            <form class="grid" onsubmit="register(this); return false;">
                    <label>Nombres<input name="name" type="text" autocomplete="given-name" required></label>
                    <label>Apellidos<input name="last_name" type="text" autocomplete="family-name" required></label>
                    <label>Correo<input name="email" type="email" autocomplete="email" required></label>
                    <label>Teléfono<input name="phone" type="tel" autocomplete="tel" required></label>
                    <label>Tipo de documento<select name="type_document" required><option default>...</option><option value="cc">Cédula de Ciudadanía</option><option value="ce">Cédula de Extranjería</option><option value="nit">NIT</option><option value="passport">Passport</option><option value="ppt">PPT</option></select></label>
                    <label>Número de documento<input name="document" required></label>
                    <label>Ciudad<select name="city" required><option default>...</option><option value="Bogota">Bogotá</option><option value="Medellin">Medellín</option><option value="Cali">Cali</option><option value="Barranquilla">Barranquilla</option><option value="Cartagena">Cartagena</option></select></label>
                    <label>Dirección<input name="address" autocomplete="street-address" required></label>
                    <label>Contraseña<input name="password" type="password" autocomplete="new-password" required></label>
                    <label>Confirmar contraseña<input name="confirm_password" type="password" autocomplete="new-password" required></label>
                    <footer><button type="submit">Crear cuenta</button></footer>
            </form>
            <footer>¿Tienes una cuenta? <a onclick="Login.close(); Register.showModal()">Iniciar sesión</a></footer>
        </dialog>
    <footer>
        <div class="container">
            <p>&copy;2026 Mi Sitio Web. Todos los derechos reservados.</p><br>
            <p>Nuetras formas de contacto:</p>
        </div>
    </footer>

    <script src="../js/products.js"></script>
    <script src="../js/app.js"></script>
    <script>getProduct(new URLSearchParams(location.search).get("id"));</script>
</body>
</html>
