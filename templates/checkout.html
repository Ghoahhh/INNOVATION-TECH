<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../css/main.css">
    <link rel="stylesheet" href="../css/products.css">
    <title>Innovation Tech| Checkout </title>
</head>
<body>
    <header>
        <nav class="container">
            <a href="../index.html">
                <img src="../img/logo-icon.png" alt="">
                <span>Innovation Tech</span>
            </a>
            <button id="menuButton" type="button" onclick="document.getElementById('menu').classList.toggle('show')" aria-label="Abrir menú">☰</button>
            <ul id="menu">
                <li><a href="../index.html">Inicio</a></li>
                <li><a href="products.html">Productos</a></li>
            </ul>
            <div class="nav-actions">
                <details>
                    <summary id="accountBtn">Cuenta ▾</summary>
                    <div>
                        <strong id="accountName">Invitado</strong>

                        <section id="accountMenu">
                            <button id="openLogin" onclick="Login.showModal()">Iniciar sesión</button>
                            <button id="openRegister" onclick="Register.showModal()">Crear cuenta</button>
                        </section>
                        <section id="userMenu" hidden>
                            <a href="dashboard.html">Mi perfil</a>
                            <a href="dashboard.html">Mis pedidos</a>
                            <a id="adminButton" href="admin.html" hidden>Panel Admin</a>
                            <button onclick="logout();">Cerrar sesión</button>
                        </section>
                    </div>
                </details>
            </div>
        </nav>
    </header>
    <main class="checkout">
        <form id="checkout" class="card">
            <h2>Datos de entrega</h2>

            <label>Nombre <input name="name" readonly></label>
            <label>Teléfono <input name="phone" type="tel" required></label>
            <label>Ciudad <input name="city" required></label>
            <label>Dirección <input name="address" required></label>
            <label>Método de pago <select name="pay_method"><option value="Tarjeta">Tarjeta</option><option value="Transferencia">Transferencia</option><option value="Contraentrega">Contraentrega</option></select></label>

            <button type="submit">Confirmar compra</button>
        </form>

        <section class="card">
            <h2>Resumen del pedido</h2>

            <div class="cartList" id="cartProducts"></div>
            <div class="cart-sm">
                <span>Subtotal $<strong id="subtotal">0</strong></span>
                <span>Envío $<strong id="shipping">0</strong></span>
                <span>Total $<strong id="total">0</strong></span>
            </div>
        </section>
    </main>
    <footer>
        <div class="container">
            <p>&copy;2026 Mi Sitio Web. Todos los derechos reservados.</p><br>
            <p>Nuetras formas de contacto:</p>
        </div>
    </footer>

    <script src="../js/products.js"></script>
    <script src="../js/app.js"></script>
</body>
</html>
